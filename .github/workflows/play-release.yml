name: Build signed Play Store bundle
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    environment: play-store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Test both editions
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore private upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Configure the private Play upload key in the play-store environment first.'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/play-upload.keystore"
      - name: Build signed store bundle
        env:
          AUDIO_DESK_RELEASE_STORE_FILE: ${{ runner.temp }}/play-upload.keystore
          AUDIO_DESK_RELEASE_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
          AUDIO_DESK_RELEASE_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
          AUDIO_DESK_RELEASE_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$AUDIO_DESK_RELEASE_STORE_PASSWORD"
          test -n "$AUDIO_DESK_RELEASE_KEY_ALIAS"
          test -n "$AUDIO_DESK_RELEASE_KEY_PASSWORD"
          gradle :app:bundleRelease --stacktrace
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: Audio-Desk-Play-SIGNED
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/play-upload.keystore"
