name: Android installed APK QA
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - feature/audio-desk-native-migration-20261127
permissions:
  contents: read
jobs:
  device-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile the exact APK under test
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Enable KVM on hosted Linux runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Boot Android, install APK, exercise UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048 -cores 2
          script: |
            mkdir -p android-qa
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            node scripts/android-device-qa.cjs
      - name: Upload runtime evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-device-QA-api-${{ matrix.api }}
          path: |
            android-qa/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 30
