name: Android motion and interaction recordings
on:
  workflow_dispatch:
  push:
    branches:
      - feature/audio-desk-native-migration-20261127
    paths:
      - 'scripts/android-motion-qa.cjs'
      - '.github/workflows/android-motion-qa.yml'
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        theme: [minimal, warm, pixel, windows, extreme, orbit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile installed debug APK and check motion script syntax
        run: |
          node --check scripts/android-motion-qa.cjs
          gradle :app:assembleDebug --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          test -r /dev/kvm && test -w /dev/kvm
      - name: Record actual Android UI with animations enabled
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MOTION_THEME: ${{ matrix.theme }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-boot-timeout: 1800
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 3072 -cores 2
          script: |
            mkdir -p motion-qa
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            node scripts/android-motion-qa.cjs
      - name: Validate recording streams
        if: always()
        run: |
          shopt -s nullglob
          videos=(motion-qa/*.mp4)
          test "${#videos[@]}" -gt 0
          for video in "${videos[@]}"; do
            ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,avg_frame_rate,duration -of json "$video" > "$video.json"
            ffmpeg -v error -xerror -i "$video" -map 0:v:0 -f null -
          done
      - name: Upload videos, interaction reports and frame statistics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Motion-QA-${{ matrix.theme }}-API35
          path: motion-qa/
          if-no-files-found: error
          retention-days: 30
