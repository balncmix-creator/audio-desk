name: Build Audio Desk APK
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main, feature/audio-desk-native-migration-20261127 ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Test app and Play edition
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:ui
      - name: Capture real UI screenshots and visual review matrix
        run: node scripts/capture-readme-screenshots.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: Audio-Desk-Visual-QA
          path: qa-artifacts/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify stable signing key
        run: test -s app/audio-desk-debug.keystore
      - name: Cache Robolectric runtime framework artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-runtime-${{ runner.os }}-${{ hashFiles('app/build.gradle.kts') }}
      - name: Run mandatory JVM unit tests
        run: |
          # Retry transient dependency fetch failures; never ignore test failures.
          for attempt in 1 2 3; do
            set +e
            gradle :app:testDebugUnitTest --stacktrace 2>&1 | tee "$RUNNER_TEMP/android-qa-build.log"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -eq 0 ]; then exit 0; fi
            if ! grep -q 'MavenArtifactFetcher.java\|Could not resolve\|Could not GET' "$RUNNER_TEMP/android-qa-build.log"; then exit "$status"; fi
            if [ "$attempt" -eq 3 ]; then exit "$status"; fi
            echo "::warning::Dependency fetch failed; retrying build (attempt $attempt of 3)"
            sleep $((attempt * 15))
          done
      - name: Build APK
        run: gradle :app:assembleDebug :app:bundleRelease --stacktrace
      # Preserve the actual Robolectric failures when an external Maven
      # download or real native regression causes the unit-test gate to fail.
      - name: Save native test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Audio-Desk-Native-Test-Failures
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
      - name: Verify packaged editions
        run: python scripts/verify-artifacts.py --apk app/build/outputs/apk/debug/app-debug.apk --bundle app/build/outputs/bundle/release/app-release.aab
      - name: Verify wallpaper resolution, provenance and quality before publishing
        run: npm run test:wallpapers
      - uses: actions/upload-artifact@v4
        with:
          name: Audio-Desk-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Audio-Desk-Play-UNSIGNED-review-only
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Publish directly downloadable test APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          test -n "$VERSION"
          TAG="v$VERSION"
          APK="Audio-Desk-Launcher-$TAG.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          elif test -f "docs/releases/$TAG.md"; then
            gh release create "$TAG" "$APK" --title "Audio Desk Launcher $TAG — QA test release" --notes-file "docs/releases/$TAG.md" --prerelease
          else
            gh release create "$TAG" "$APK" --title "Audio Desk Launcher $TAG (test APK)" --notes "Signed Android debug test build; not a Play Store release. Built from commit ${GITHUB_SHA}." --prerelease
          fi

      - name: Save screenshot images to the README gallery
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.png
          if ! git diff --cached --quiet; then
            git commit -m "docs: refresh actual Audio Desk screenshots [skip ci]"
            git push origin HEAD:main
          fi

      - name: Publish development APK as a direct-download prerelease
        if: github.ref == 'refs/heads/feature/audio-desk-native-migration-20261127' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="test-build-${GITHUB_RUN_NUMBER}"
          APK="AudioDesk.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          sha256sum "$APK" > AudioDesk.apk.sha256
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" AudioDesk.apk.sha256 --clobber
          else
            gh release create "$TAG" "$APK" AudioDesk.apk.sha256 --target "$GITHUB_SHA" --title "Audio Desk — Test build #${GITHUB_RUN_NUMBER}" --notes "Development debug APK. Build, browser tests, JVM tests and package checks passed. Separate emulator QA may still be running or incomplete. Source: ${GITHUB_SHA}. Build: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Not a production or fully native release." --prerelease --latest=false
          fi
  publish-existing-and-gallery:
    if: github.ref == 'refs/heads/feature/audio-desk-native-migration-20261127' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/audio-desk-native-migration-20261127
      - name: Publish already-built #477 as a test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view test-build-477 >/dev/null 2>&1; then exit 0; fi
          gh run download 46101887632 --name Audio-Desk-APK --dir "$RUNNER_TEMP/build477"
          cp "$RUNNER_TEMP/build477/app-debug.apk" AudioDesk.apk
          sha256sum AudioDesk.apk > AudioDesk.apk.sha256
          gh release create test-build-477 AudioDesk.apk AudioDesk.apk.sha256 --target 9459e150a0127ed7762e4e0e97aeaf3e54cd31ed --title "Audio Desk — Test build #477" --notes "Warm Minimal targeted motion QA: 29/29 passed. Android 11 and JVM tests passed. Broad Android 15 regression was incomplete in the original run; see https://github.com/balncmix-creator/audio-desk/actions/runs/46101887675 for subsequent attempts. Visual refinements and native migration remain incomplete. Signed debug APK." --prerelease --latest=false
      - name: Add genuine emulator screenshot gallery to development README
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q '<!-- android-emulator-gallery -->' README.md; then exit 0; fi
          gh run download 46101887675 --name Android-device-QA-api-30 --dir "$RUNNER_TEMP/emulator477"
          mkdir -p docs/screenshots/emulator
          for image in warm-home warm-apps minimal-home pixel-home windows-home orbit-home extreme-home visual-warm-quick-actions warm-music-resize; do
            cp "$RUNNER_TEMP/emulator477/$image.png" "docs/screenshots/emulator/$image.png"
          done
          python - <<'PY'
          from pathlib import Path
          p = Path("README.md")
          source = p.read_text()
          gallery = """<!-- android-emulator-gallery -->
          ## Android emulator screenshots

          Genuine captures of the installed test APK, build #477, on Android 11 (API 30), Pixel 2 emulator. [Source QA run](https://github.com/balncmix-creator/audio-desk/actions/runs/46101887675). These are development screenshots, not design mockups or physical-device certification.

          | Warm Minimal | Minimal A–Z | 8-Bit |
          |:--:|:--:|:--:|
          | <img src="docs/screenshots/emulator/warm-home.png" width="220" alt="Warm Minimal home"> | <img src="docs/screenshots/emulator/minimal-home.png" width="220" alt="Minimal home"> | <img src="docs/screenshots/emulator/pixel-home.png" width="220" alt="8-Bit home"> |

          | Windows Tiles | Orbit | Extreme Minimal |
          |:--:|:--:|:--:|
          | <img src="docs/screenshots/emulator/windows-home.png" width="220" alt="Windows tiles home"> | <img src="docs/screenshots/emulator/orbit-home.png" width="220" alt="Orbit home"> | <img src="docs/screenshots/emulator/extreme-home.png" width="220" alt="Extreme Minimal home"> |

          | Warm Minimal apps | Quick actions | Widget editing |
          |:--:|:--:|:--:|
          | <img src="docs/screenshots/emulator/warm-apps.png" width="220" alt="Warm Minimal app list"> | <img src="docs/screenshots/emulator/visual-warm-quick-actions.png" width="220" alt="Warm Minimal quick actions"> | <img src="docs/screenshots/emulator/warm-music-resize.png" width="220" alt="Music widget layout editor"> |

          [Download development APKs directly from Releases](https://github.com/balncmix-creator/audio-desk/releases).

          <!-- /android-emulator-gallery -->

          """
          anchor = "## v4.2.2 — News feed reliability"
          assert anchor in source
          p.write_text(source.replace(anchor, gallery + anchor, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/screenshots/emulator
          if ! git diff --cached --quiet; then
            git commit -m "docs: add actual Android emulator captures [skip ci]"
            git push origin HEAD:feature/audio-desk-native-migration-20261127
          fi
