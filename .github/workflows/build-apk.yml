name: Build Audio Desk APK
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Test app and Play edition
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:ui
      - name: Capture real UI screenshots for README
        run: node scripts/capture-readme-screenshots.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify stable signing key
        run: test -s app/audio-desk-debug.keystore
      - name: Build APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:bundleRelease --stacktrace
      - name: Verify packaged editions
        run: python scripts/verify-artifacts.py --apk app/build/outputs/apk/debug/app-debug.apk --bundle app/build/outputs/bundle/release/app-release.aab
      - name: Verify wallpaper resolution, provenance and quality before publishing
        run: npm run test:wallpapers
      - uses: actions/upload-artifact@v4
        with:
          name: Audio-Desk-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Audio-Desk-Play-UNSIGNED-review-only
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Publish directly downloadable test APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          test -n "$VERSION"
          TAG="v$VERSION"
          APK="Audio-Desk-Launcher-$TAG.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "Audio Desk Launcher $TAG (test APK)" --notes "MeeGo-inspired Android HOME launcher with real installed-app grid and Audio Desk news. Select as default Home in Android Settings. RECENTS is launcher activity history, not privileged Android task snapshots. Direct installable debug APK; not a Play Store release. Build commit: ${GITHUB_SHA}" --prerelease
          fi

      - name: Save screenshot images to the README gallery
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.png
          if ! git diff --cached --quiet; then
            git commit -m "docs: refresh actual Audio Desk screenshots [skip ci]"
            git push origin HEAD:main
          fi
