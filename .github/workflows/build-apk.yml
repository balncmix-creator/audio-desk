name: Build Audio Desk APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore stable APK signing key
        env:
          AUDIO_DESK_KEYSTORE_BASE64: ${{ secrets.AUDIO_DESK_KEYSTORE_BASE64 }}
        run: |
          test -n "$AUDIO_DESK_KEYSTORE_BASE64" || { echo "Missing AUDIO_DESK_KEYSTORE_BASE64 repository secret"; exit 1; }
          echo "$AUDIO_DESK_KEYSTORE_BASE64" | base64 --decode > app/audio-desk-debug.keystore
          test -s app/audio-desk-debug.keystore
      - name: Build APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Audio-Desk-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
