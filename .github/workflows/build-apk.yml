name: Build Audio Desk APK
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Test app and Play edition
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:ui
      - name: Capture real UI screenshots and visual review matrix
        run: node scripts/capture-readme-screenshots.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: Audio-Desk-Visual-QA
          path: qa-artifacts/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify stable signing key
        run: test -s app/audio-desk-debug.keystore
      - name: Cache Robolectric runtime framework artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-runtime-${{ runner.os }}-${{ hashFiles('app/build.gradle.kts') }}
      - name: Run mandatory JVM unit tests
        run: |
          # Retry transient dependency fetch failures; never ignore test failures.
          for attempt in 1 2 3; do
            set +e
            gradle :app:testDebugUnitTest --stacktrace 2>&1 | tee "$RUNNER_TEMP/android-qa-build.log"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -eq 0 ]; then exit 0; fi
            if ! grep -q 'MavenArtifactFetcher.java\|Could not resolve\|Could not GET' "$RUNNER_TEMP/android-qa-build.log"; then exit "$status"; fi
            if [ "$attempt" -eq 3 ]; then exit "$status"; fi
            echo "::warning::Dependency fetch failed; retrying build (attempt $attempt of 3)"
            sleep $((attempt * 15))
          done
      - name: Build APK
        run: gradle :app:assembleDebug :app:bundleRelease --stacktrace
      # Preserve the actual Robolectric failures when an external Maven
      # download or real native regression causes the unit-test gate to fail.
      - name: Save native test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Audio-Desk-Native-Test-Failures
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
      - name: Verify packaged editions
        run: python scripts/verify-artifacts.py --apk app/build/outputs/apk/debug/app-debug.apk --bundle app/build/outputs/bundle/release/app-release.aab
      - name: Verify wallpaper resolution, provenance and quality before publishing
        run: npm run test:wallpapers
      - uses: actions/upload-artifact@v4
        with:
          name: Audio-Desk-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Audio-Desk-Play-UNSIGNED-review-only
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
      - name: Publish directly downloadable test APK
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          test -n "$VERSION"
          TAG="v$VERSION"
          APK="Audio-Desk-Launcher-$TAG.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          elif test -f "docs/releases/$TAG.md"; then
            gh release create "$TAG" "$APK" --title "Audio Desk Launcher $TAG — QA test release" --notes-file "docs/releases/$TAG.md" --prerelease
          else
            gh release create "$TAG" "$APK" --title "Audio Desk Launcher $TAG (test APK)" --notes "Signed Android debug test build; not a Play Store release. Built from commit ${GITHUB_SHA}." --prerelease
          fi

      - name: Save screenshot images to the README gallery
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/*.png
          if ! git diff --cached --quiet; then
            git commit -m "docs: refresh actual Audio Desk screenshots [skip ci]"
            git push origin HEAD:main
          fi
