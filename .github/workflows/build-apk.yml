name: Build Audio Desk APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Test app and Play edition
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify stable signing key
        run: test -s app/audio-desk-debug.keystore
      - name: Build APK
        run: gradle :app:assembleDebug :app:bundleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Audio-Desk-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Audio-Desk-Play-UNSIGNED-review-only
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
